services:
  # ============================================================
  # 1. Backend API Service
  # ============================================================
  - type: web
    name: tickethub-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tickethub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: HOLD_TTL_MINUTES
        value: 10
      - key: OFFER_TTL_MINUTES
        value: 30
      - key: SWEEP_INTERVAL_MS
        value: 3000
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: tickets@tickethub.local
      - key: FROM_NAME
        value: TicketHub

  # ============================================================
  # 2. Frontend Static Site
  # ============================================================
  - type: web
    name: tickethub-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tickethub-api
          property: host

databases:
  # ============================================================
  # 3. PostgreSQL Database
  # ============================================================
  - name: tickethub-db
    databaseName: tickethub
    user: tickethub_user
    plan: free
